<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery — Whiskey Peddler</title>
  <meta name="description" content="Photos from Whiskey Peddler shows across Minnesota." />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    /* Masonry: columns keep each photo's natural shape (portrait or landscape) */
    .gallery-grid {
      column-width: 260px;
      column-gap: 12px;
      margin-top: 2rem;
    }
    .gallery-item {
      display: block;
      width: 100%;
      margin: 0 0 12px;
      padding: 0;
      border: 1px solid #333;
      background: #111;
      cursor: pointer;
      break-inside: avoid;
      overflow: hidden;
    }
    .gallery-item img {
      display: block;
      width: 100%;
      height: auto;
      transition: opacity 0.2s ease;
    }
    .gallery-item:hover img,
    .gallery-item:focus-visible img { opacity: 0.8; }
    .gallery-item:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

    .gallery-status {
      margin-top: 2rem;
      color: #c8c8c8;
    }

    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.94);
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 92vw;
      max-height: 88vh;
      width: auto;
      height: auto;
      object-fit: contain;
    }
    .lightbox button {
      position: absolute;
      background: none;
      border: 0;
      color: #fff;
      font-size: 2.5rem;
      line-height: 1;
      padding: 0.75rem 1rem;
      cursor: pointer;
      opacity: 0.8;
    }
    .lightbox button:hover,
    .lightbox button:focus-visible { opacity: 1; }
    .lb-close { top: 0.5rem; right: 0.5rem; }
    .lb-prev { left: 0.5rem; top: 50%; transform: translateY(-50%); }
    .lb-next { right: 0.5rem; top: 50%; transform: translateY(-50%); }
    .lb-count {
      position: absolute;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      color: #c8c8c8;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div id="site-header"></div>

  <main class="page-section">
    <h1 class="page-title">Gallery</h1>
    <p class="page-subtitle">Live shots from the road.</p>

    <p class="gallery-status" id="gallery-status">Loading photos…</p>
    <div class="gallery-grid" id="gallery-grid"></div>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="lb-close" id="lb-close" aria-label="Close">&times;</button>
    <button class="lb-prev" id="lb-prev" aria-label="Previous photo">&#8249;</button>
    <img id="lb-img" alt="" />
    <button class="lb-next" id="lb-next" aria-label="Next photo">&#8250;</button>
    <div class="lb-count" id="lb-count"></div>
  </div>

  <div id="site-footer"></div>

  <script>window.SITE_BASE = "../";</script>
  <script src="../js/main.js"></script>
  <script>
    (function () {
      // Folder to read photos from. Drop images in assets/gallery/ and they show up.
      var REPO = 'tmadrinich/whiskeypeddlerband';
      var BRANCH = 'main';
      var FOLDER = 'assets/gallery';
      var CACHE_KEY = 'wpb-gallery-list';

      var base = window.SITE_BASE || '';
      var grid = document.getElementById('gallery-grid');
      var status = document.getElementById('gallery-status');
      var lightbox = document.getElementById('lightbox');
      var lbImg = document.getElementById('lb-img');
      var lbCount = document.getElementById('lb-count');
      var photos = [];
      var current = 0;

      function isImage(name) {
        return /\.(jpe?g|png|webp|gif|avif)$/i.test(name);
      }

      function loadList() {
        try {
          var cached = sessionStorage.getItem(CACHE_KEY);
          if (cached) return Promise.resolve(JSON.parse(cached));
        } catch (e) {}

        var url = 'https://api.github.com/repos/' + REPO + '/contents/' + FOLDER + '?ref=' + BRANCH;
        return fetch(url)
          .then(function (res) {
            if (res.status === 404) return [];
            if (!res.ok) throw new Error(res.status);
            return res.json();
          })
          .then(function (items) {
            var names = items
              .filter(function (i) { return i.type === 'file' && isImage(i.name); })
              .map(function (i) { return i.name; })
              .sort(function (a, b) { return a.localeCompare(b, undefined, { numeric: true }); });
            try { sessionStorage.setItem(CACHE_KEY, JSON.stringify(names)); } catch (e) {}
            return names;
          });
      }

      function render(names) {
        if (!names.length) {
          status.textContent = 'No photos yet — check back soon.';
          return;
        }
        status.hidden = true;
        photos = names.map(function (n) { return base + FOLDER + '/' + encodeURIComponent(n); });

        photos.forEach(function (src, i) {
          var btn = document.createElement('button');
          btn.className = 'gallery-item';
          btn.type = 'button';
          btn.setAttribute('aria-label', 'Open photo ' + (i + 1));

          var img = document.createElement('img');
          img.src = src;
          img.alt = 'Whiskey Peddler live photo ' + (i + 1);
          img.loading = 'lazy';
          img.decoding = 'async';

          btn.appendChild(img);
          btn.addEventListener('click', function () { open(i); });
          grid.appendChild(btn);
        });
      }

      function show(i) {
        current = (i + photos.length) % photos.length;
        lbImg.src = photos[current];
        lbCount.textContent = (current + 1) + ' / ' + photos.length;
      }
      function open(i) {
        show(i);
        lightbox.classList.add('open');
        document.body.style.overflow = 'hidden';
      }
      function close() {
        lightbox.classList.remove('open');
        document.body.style.overflow = '';
        lbImg.removeAttribute('src');
      }

      document.getElementById('lb-close').addEventListener('click', close);
      document.getElementById('lb-prev').addEventListener('click', function () { show(current - 1); });
      document.getElementById('lb-next').addEventListener('click', function () { show(current + 1); });
      lightbox.addEventListener('click', function (e) { if (e.target === lightbox) close(); });

      document.addEventListener('keydown', function (e) {
        if (!lightbox.classList.contains('open')) return;
        if (e.key === 'Escape') close();
        if (e.key === 'ArrowLeft') show(current - 1);
        if (e.key === 'ArrowRight') show(current + 1);
      });

      // Swipe on touch screens
      var startX = null;
      lightbox.addEventListener('touchstart', function (e) { startX = e.touches[0].clientX; }, { passive: true });
      lightbox.addEventListener('touchend', function (e) {
        if (startX === null) return;
        var dx = e.changedTouches[0].clientX - startX;
        if (Math.abs(dx) > 50) show(current + (dx < 0 ? 1 : -1));
        startX = null;
      }, { passive: true });

      loadList().then(render).catch(function () {
        status.textContent = "Couldn't load photos right now. Try refreshing.";
      });
    })();
  </script>
</body>
</html>
