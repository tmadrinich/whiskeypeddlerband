<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shows — Whiskey Peddler</title>
  <meta name="description" content="Upcoming Whiskey Peddler shows in Minnesota and Iowa." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&display=swap" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="icon" type="image/png" href="../assets/favicon-64.png" />
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png" />
</head>
<body>

  <div id="site-header"></div>

  <main class="page-section">
    <h1 class="page-title">Shows</h1>
    <p class="page-subtitle">Where to catch us next.</p>

    <!-- List view -->
    <div id="events-container" class="events-list">
      <p>Loading upcoming shows...</p>
    </div>

    <div class="shows-cta">
      <p class="body-copy">Want us at your bar, backyard, or festival?</p>
      <a href="../contact/" class="hero-btn">Book a Show</a>
    </div>
  </main>

  <div id="site-footer"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Calendar must be shared publicly for the API to read it.
      const calendarId = 'booking@whiskeypeddlerband.com';
      const apiKey = 'AIzaSyB_RBE2uJrIboCbq2kArZixFyv91zBUOBA';
      const maxEvents = 20;

      const container = document.getElementById('events-container');
      const esc = s => String(s).replace(/[&<>"']/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));

      const url =
        'https://www.googleapis.com/calendar/v3/calendars/' +
        encodeURIComponent(calendarId) +
        '/events?key=' + apiKey +
        '&timeMin=' + encodeURIComponent(new Date().toISOString()) +
        '&singleEvents=true&orderBy=startTime&maxResults=' + maxEvents;

      fetch(url)
        .then(res => res.json())
        .then(data => {
          if (!data.items || data.items.length === 0) {
            container.innerHTML = '<p>No upcoming shows.</p>';
            return;
          }

          const timeOpts = { hour: 'numeric', minute: '2-digit', hour12: true };

          container.innerHTML = data.items.map(event => {
            const allDay = !event.start.dateTime;
            const start = new Date(event.start.dateTime || event.start.date + 'T00:00:00');
            const end = new Date(event.end.dateTime || event.end.date + 'T00:00:00');

            const dow = start.toLocaleDateString('en-US', { weekday: 'short' });
            const day = start.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            const year = start.getFullYear() !== new Date().getFullYear() ? ' ' + start.getFullYear() : '';
            const timeStr = allDay
              ? 'All day'
              : start.toLocaleTimeString('en-US', timeOpts) + ' – ' + end.toLocaleTimeString('en-US', timeOpts);

            return `
              <div class="event-card">
                <div class="event-date">
                  <span class="ed-dow">${dow}${year}</span>
                  <span class="ed-day">${day}</span>
                </div>
                <div>
                  <div class="event-title">${esc(event.summary || 'Show')}</div>
                  <div class="event-location">${esc(event.location || 'Location TBD')}</div>
                  <div class="event-time">${timeStr}</div>
                </div>
              </div>
            `;
          }).join('');
        })
        .catch(err => {
          console.error('Fetch error:', err);
          container.innerHTML = '<p>Failed to load events.</p>';
        });
    });
  </script>

  <script>window.SITE_BASE = "../";</script>
  <script src="../js/main.js"></script>
</body>
</html>
