<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shows — Whiskey Peddler</title>
  <meta name="description" content="Upcoming Whiskey Peddler shows in Minnesota and Iowa." />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <div id="site-header"></div>

  <main class="page-section">
    <h1 class="page-title">Shows</h1>
    <p class="page-subtitle">Where to catch us next.</p>

    <div class="calendar-wrap">
      <!--
        Swap in your real embed: Google Calendar → Settings → select your
        show calendar → "Integrate calendar" → copy the <iframe> src URL
        and paste it below.
      -->
      <iframe
        src="https://calendar.google.com/calendar/embed?src=REPLACE_WITH_YOUR_CALENDAR_ID&ctz=America%2FChicago&mode=AGENDA&showTitle=0&showPrint=0&showCalendars=0&showTz=0"
        title="Whiskey Peddler upcoming shows calendar"
        loading="lazy">
      </iframe>
    </div>

    <div class="shows-cta">
      <p class="body-copy" style="margin: 0 auto;">Want us at your bar, backyard, or festival?</p>
      <a href="../contact/">Book a Show</a>
    </div>
  </main>

  <div id="site-footer"></div>

  <script>window.SITE_BASE = "../";</script>
  <script src="../js/main.js"></script>
</body>
</html>
